# Importa variables locales sin guardar secretos en el repositorio.
spring.config.import=optional:file:./.env[.properties]

spring.application.name=edualerta-api
server.port=${PORT:8080}

# Credenciales de PostgreSQL inyectadas desde Docker Compose o el entorno.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Solo para desarrollo inicial. Más adelante lo sustituiremos por migraciones Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Secreto Base64 para firmar JWT. Debe reemplazarse fuera del desarrollo local.
security.jwt.secret=${JWT_SECRET}
security.jwt.ttl-seconds=${JWT_TTL_SECONDS:28800}

# Cuenta de administrador creada una sola vez si el correo aún no existe.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@edualerta.local}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.nombres=${BOOTSTRAP_ADMIN_NOMBRES:Administrador}
app.bootstrap-admin.apellidos=${BOOTSTRAP_ADMIN_APELLIDOS:EduAlerta}

# Evita exponer mensajes internos completos en respuestas del servidor.
server.error.include-message=never


# Migraciones versionadas del esquema de base de datos.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Adopta el esquema existente sin volver a ejecutar V1.
# En una base vacía, Flyway ejecutará V1 y luego V2.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Esquema existente de EduAlerta
# URL interna del servicio FastAPI definida en Docker Compose.
ml.service.base-url=${ML_SERVICE_BASE_URL:http://localhost:8000}
